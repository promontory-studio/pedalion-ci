name: provenance

# Dogfooding, the way `autopilot.yml` is: this repository calling its own reusable workflow against
# its own pull requests. It arms this repository with no pin to move, which makes it the first
# corpus the rule is enforced over.
#
# **Its own file, and not a job in `ci.yml`, because of `edited`.** A body this check refuses is
# fixed by editing the body, and `pull_request` does not carry `edited` by default -- so in `ci.yml`
# the author would have to push a commit they do not need to clear a check about prose. Adding
# `edited` to `ci.yml` instead would re-run the suite, the leak check and CodeQL every time somebody
# fixes a typo in a title. A caller wants this shape for the same reason; USAGE.md says so.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  provenance:
    uses: ./.github/workflows/provenance.yml
    with:
      body: ${{ github.event.pull_request.body }}
      pr-author: ${{ github.event.pull_request.user.login }}
      pr-author-type: ${{ github.event.pull_request.user.type }}
